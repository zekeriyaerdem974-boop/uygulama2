{% extends "layout_terminal.html" %}

{% block title %}Analiz • ZKR Analiz{% endblock %}
{% block page_title %}Analiz{% endblock %}
{% block topbar_title %}Analysis{% endblock %}

{% block extra_head %}
<meta name="analysis-id" content="{{ analysis_id }}" />
<style>
  .an-detail { max-width: 640px; margin: 0 auto; padding: 16px; }
  .an-card { background: #111; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); }
  .an-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .an-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #2979FF, #00C853); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #fff; text-decoration: none; flex-shrink: 0; }
  .an-user-info { flex: 1; min-width: 0; }
  .an-username { font-weight: 600; font-size: 15px; color: #e5e7eb; text-decoration: none; }
  .an-username:hover { color: #2979FF; }
  .an-trust { font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; margin-left: 6px; }
  .an-meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .an-symbol-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(41,121,255,0.1); color: #2979FF; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .an-direction { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; margin-left: 6px; }
  .an-direction-long { background: rgba(0,200,83,0.15); color: #00C853; }
  .an-direction-short { background: rgba(255,23,68,0.15); color: #FF1744; }
  .an-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px; line-height: 1.3; }
  .an-content { font-size: 14px; color: #d1d5db; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .an-chart-img { width: 100%; border-radius: 12px; margin: 16px 0; border: 1px solid rgba(255,255,255,0.05); }
  .an-stats { display: flex; gap: 16px; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 16px; font-size: 13px; color: #9ca3af; }
  .an-stats span { display: flex; align-items: center; gap: 4px; }
  .an-actions { display: flex; gap: 8px; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.05); }
  .an-action-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); color: #9ca3af; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .an-action-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .an-action-btn.liked { color: #FF1744; background: rgba(255,23,68,0.08); border-color: rgba(255,23,68,0.15); }
  .an-share-bar { display: flex; gap: 8px; margin-top: 8px; }
  .an-share-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: #d1d5db; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
  .an-share-btn:hover { background: rgba(255,255,255,0.08); }
  .an-share-x { border-color: rgba(29,161,242,0.2); }
  .an-share-x:hover { background: rgba(29,161,242,0.1); color: #1DA1F2; }
  .an-comments-section { margin-top: 0; }
  .an-comment { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .an-comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #9ca3af; flex-shrink: 0; }
  .an-comment-body { flex: 1; }
  .an-comment-user { font-size: 13px; font-weight: 600; color: #e5e7eb; }
  .an-comment-text { font-size: 13px; color: #d1d5db; margin-top: 2px; }
  .an-comment-time { font-size: 11px; color: #6b7280; margin-top: 4px; }
  .an-comment-form { display: flex; gap: 8px; margin-top: 16px; }
  .an-comment-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #fff; outline: none; }
  .an-comment-input:focus { border-color: rgba(41,121,255,0.5); }
  .an-comment-submit { padding: 10px 20px; border-radius: 12px; background: #2979FF; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
  .an-comment-submit:hover { background: #1565C0; }
  .an-loading { text-align: center; padding: 60px 20px; color: #6b7280; font-size: 14px; }
  .an-not-found { text-align: center; padding: 60px 20px; }
  .an-not-found h2 { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 8px; }
  .an-not-found p { color: #6b7280; font-size: 14px; }
  .an-toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #2979FF; color: #fff; padding: 10px 24px; border-radius: 12px; font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .an-toast.show { opacity: 1; }
</style>
{% endblock %}

{% block content %}
<div class="an-detail" id="analysisDetail">
  <div class="an-loading" id="anLoading">Yükleniyor…</div>
</div>
<div class="an-toast" id="anToast"></div>
{% endblock %}

{% block scripts %}
<script>
(function(){
  const analysisId = document.querySelector('meta[name="analysis-id"]')?.content;
  const container = document.getElementById('analysisDetail');
  const loading = document.getElementById('anLoading');

  if (!analysisId) { loading.textContent = 'Analiz bulunamadı'; return; }

  let analysisData = null;
  let commentsData = [];

  async function api(url, opts) {
    const r = await fetch(url, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
    return r.json();
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function timeAgo(iso) {
    const d = new Date(iso);
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'Az önce';
    if (diff < 3600) return Math.floor(diff/60) + 'dk';
    if (diff < 86400) return Math.floor(diff/3600) + 'sa';
    return Math.floor(diff/86400) + 'g';
  }

  function trustBadge(level) {
    if (!level) return '';
    const colors = {'Beginner Analyst':'#64748b','Trusted Analyst':'#3b82f6','Top Analyst':'#f59e0b','Elite Mentor':'#ef4444'};
    const c = colors[level] || '#64748b';
    return `<span class="an-trust" style="color:${c};background:${c}22;">${escapeHtml(level)}</span>`;
  }

  function showToast(msg) {
    const t = document.getElementById('anToast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  async function load() {
    const d = await api('/api/analysis/' + encodeURIComponent(analysisId));
    if (!d.ok) {
      container.innerHTML = '<div class="an-not-found"><h2>Analiz Bulunamadı</h2><p>Bu analiz silinmiş veya mevcut değil.</p></div>';
      return;
    }
    analysisData = d.analysis;
    commentsData = d.comments || [];
    render();
  }

  function render() {
    const a = analysisData;
    const dirClass = a.direction === 'long' ? 'an-direction-long' : a.direction === 'short' ? 'an-direction-short' : '';
    const dirText = a.direction === 'long' ? '📈 LONG' : a.direction === 'short' ? '📉 SHORT' : '';

    let chartHtml = '';
    if (a.chart_image) {
      chartHtml = `<img class="an-chart-img" src="${escapeHtml(a.chart_image)}" alt="Grafik analizi" loading="lazy" />`;
    }

    let commentsHtml = commentsData.map(c => `
      <div class="an-comment">
        <div class="an-comment-avatar">${(c.username||'?')[0].toUpperCase()}</div>
        <div class="an-comment-body">
          <span class="an-comment-user">@${escapeHtml(c.username)}</span>
          <div class="an-comment-text">${escapeHtml(c.content)}</div>
          <div class="an-comment-time">${timeAgo(c.created_at)}</div>
        </div>
      </div>
    `).join('');

    container.innerHTML = `
      <div class="an-card">
        <div class="an-header">
          <a href="/user/${encodeURIComponent(a.username)}" class="an-avatar">${(a.username||'?')[0].toUpperCase()}</a>
          <div class="an-user-info">
            <div>
              <a href="/user/${encodeURIComponent(a.username)}" class="an-username">@${escapeHtml(a.username)}</a>
              ${trustBadge(a.trust_level)}
            </div>
            <div class="an-meta">
              ${timeAgo(a.created_at)}
              ${a.symbol ? `<span class="an-symbol-badge" style="margin-left:8px">${escapeHtml(a.symbol)}</span>` : ''}
              ${dirText ? `<span class="an-direction ${dirClass}" style="margin-left:4px">${dirText}</span>` : ''}
              ${a.timeframe ? ` • ${escapeHtml(a.timeframe)}` : ''}
            </div>
          </div>
        </div>

        ${a.title ? `<h1 class="an-title">${escapeHtml(a.title)}</h1>` : ''}
        <div class="an-content">${escapeHtml(a.content)}</div>
        ${chartHtml}

        <div class="an-stats">
          <span>👁 ${a.views_count || 0} görüntülenme</span>
          <span>❤️ ${a.likes_count || 0} beğeni</span>
          <span>💬 ${a.comments_count || 0} yorum</span>
          <span>🔗 ${a.shares_count || 0} paylaşım</span>
        </div>

        <div class="an-actions">
          <button class="an-action-btn ${a.is_liked ? 'liked' : ''}" id="anLikeBtn" onclick="AN.toggleLike()">
            ❤️ <span id="anLikeCount">${a.likes_count || 0}</span>
          </button>
          <button class="an-action-btn" onclick="document.getElementById('anCommentInput').focus()">
            💬 Yorum
          </button>
          <button class="an-action-btn" onclick="AN.shareMenu()">
            🔗 Paylaş
          </button>
        </div>

        <div class="an-share-bar" id="anShareBar" style="display:none">
          <button class="an-share-btn an-share-x" onclick="AN.shareX()">𝕏 Paylaş</button>
          <button class="an-share-btn" onclick="AN.copyLink()">📋 Link Kopyala</button>
        </div>
      </div>

      <div class="an-card an-comments-section">
        <h3 style="font-size:15px;font-weight:600;margin-bottom:12px;">Yorumlar (${commentsData.length})</h3>
        ${commentsHtml || '<p style="color:#6b7280;font-size:13px;">Henüz yorum yok. İlk yorumu sen yaz!</p>'}
        <div class="an-comment-form">
          <input id="anCommentInput" class="an-comment-input" placeholder="Yorum yaz…" autocomplete="off" />
          <button class="an-comment-submit" onclick="AN.submitComment()">Gönder</button>
        </div>
      </div>
    `;
  }

  window.AN = {
    toggleLike: async function() {
      const d = await api('/api/analysis/like', {method:'POST', body: JSON.stringify({analysis_id: analysisId})});
      if (d.ok !== undefined) {
        const btn = document.getElementById('anLikeBtn');
        const cnt = document.getElementById('anLikeCount');
        btn.classList.toggle('liked', d.liked);
        cnt.textContent = d.likes_count;
        analysisData.is_liked = d.liked;
        analysisData.likes_count = d.likes_count;
      }
    },
    submitComment: async function() {
      const input = document.getElementById('anCommentInput');
      const content = input.value.trim();
      if (!content) return;
      const d = await api('/api/analysis/comment', {method:'POST', body: JSON.stringify({analysis_id: analysisId, content})});
      if (d.ok) {
        commentsData.push(d.comment);
        analysisData.comments_count = commentsData.length;
        input.value = '';
        render();
      }
    },
    shareMenu: function() {
      const bar = document.getElementById('anShareBar');
      bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
      // Track share
      api('/api/analysis/share', {method:'POST', body: JSON.stringify({analysis_id: analysisId})});
    },
    shareX: function() {
      const url = encodeURIComponent(window.location.href);
      const text = encodeURIComponent((analysisData.title || analysisData.symbol || 'Analiz') + ' — ZKR Analiz');
      window.open('https://x.com/intent/tweet?text=' + text + '&url=' + url, '_blank', 'width=550,height=420');
    },
    copyLink: function() {
      navigator.clipboard.writeText(window.location.href).then(() => showToast('Link kopyalandı!')).catch(() => showToast('Kopyalanamadı'));
    }
  };

  load();
})();
</script>
{% endblock %}
