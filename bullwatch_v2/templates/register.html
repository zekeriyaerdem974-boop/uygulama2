{% extends "base.html" %}
{% block title %}Kayıt Ol — ZKR Analiz{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="bg-neutral-900/60 border border-neutral-800 rounded-xl p-8">
    <h1 class="text-2xl font-bold mb-6 text-center">🐂 Kayıt Ol</h1>

    <div id="regError" class="hidden mb-4 p-3 bg-red-500/15 border border-red-500/30 rounded-lg text-red-400 text-sm"></div>
    <div id="regSuccess" class="hidden mb-4 p-3 bg-green-500/15 border border-green-500/30 rounded-lg text-green-400 text-sm"></div>

    <form id="registerForm" class="space-y-4">
      <div>
        <label class="block text-sm text-neutral-400 mb-1">Kullanıcı Adı</label>
        <input type="text" id="regUsername" required minlength="2"
               class="w-full px-4 py-2.5 bg-neutral-800 border border-neutral-700 rounded-lg text-white focus:border-blue-500 focus:outline-none"
               placeholder="Kullanıcı adı" autocomplete="username" />
      </div>
      <div>
        <label class="block text-sm text-neutral-400 mb-1">E-posta</label>
        <input type="email" id="regEmail" required
               class="w-full px-4 py-2.5 bg-neutral-800 border border-neutral-700 rounded-lg text-white focus:border-blue-500 focus:outline-none"
               placeholder="ornek@email.com" autocomplete="email" />
      </div>
      <div>
        <label class="block text-sm text-neutral-400 mb-1">Şifre</label>
        <input type="password" id="regPassword" required minlength="6"
               class="w-full px-4 py-2.5 bg-neutral-800 border border-neutral-700 rounded-lg text-white focus:border-blue-500 focus:outline-none"
               placeholder="En az 6 karakter" autocomplete="new-password" />
      </div>
      <div>
        <label class="block text-sm text-neutral-400 mb-1">Şifre Tekrar</label>
        <input type="password" id="regPassword2" required minlength="6"
               class="w-full px-4 py-2.5 bg-neutral-800 border border-neutral-700 rounded-lg text-white focus:border-blue-500 focus:outline-none"
               placeholder="Şifreyi tekrar girin" autocomplete="new-password" />
      </div>
      <button type="submit" id="regBtn"
              class="w-full py-2.5 bg-green-600 hover:bg-green-500 text-white font-semibold rounded-lg transition">
        Kayıt Ol
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-neutral-400">
      Zaten hesabınız var mı?
      <a href="/login" class="text-blue-400 hover:text-blue-300">Giriş Yap</a>
    </p>
  </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('regError');
  const sucEl = document.getElementById('regSuccess');
  const btn = document.getElementById('regBtn');
  errEl.classList.add('hidden');
  sucEl.classList.add('hidden');

  const pw1 = document.getElementById('regPassword').value;
  const pw2 = document.getElementById('regPassword2').value;
  if (pw1 !== pw2) {
    errEl.textContent = 'Şifreler eşleşmiyor';
    errEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Kaydediliyor…';

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('regUsername').value,
        email: document.getElementById('regEmail').value,
        password: pw1,
      }),
    });
    const data = await res.json();
    if (data.ok) {
      sucEl.textContent = 'Kayıt başarılı! Yönlendiriliyorsunuz…';
      sucEl.classList.remove('hidden');
      setTimeout(() => { window.location.href = '/trade'; }, 1000);
    } else {
      errEl.textContent = data.error || 'Kayıt başarısız';
      errEl.classList.remove('hidden');
    }
  } catch (err) {
    errEl.textContent = 'Bağlantı hatası';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Kayıt Ol';
  }
});
</script>
{% endblock %}
