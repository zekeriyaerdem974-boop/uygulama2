{% extends "base.html" %}
{% block title %}Giriş Yap — ZKR Analiz{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="bg-neutral-900/60 border border-neutral-800 rounded-xl p-8">
    <h1 class="text-2xl font-bold mb-6 text-center">🐂 Giriş Yap</h1>

    <div id="loginError" class="hidden mb-4 p-3 bg-red-500/15 border border-red-500/30 rounded-lg text-red-400 text-sm"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm text-neutral-400 mb-1">E-posta</label>
        <input type="email" id="loginEmail" required
               class="w-full px-4 py-2.5 bg-neutral-800 border border-neutral-700 rounded-lg text-white focus:border-blue-500 focus:outline-none"
               placeholder="ornek@email.com" autocomplete="email" />
      </div>
      <div>
        <label class="block text-sm text-neutral-400 mb-1">Şifre</label>
        <input type="password" id="loginPassword" required
               class="w-full px-4 py-2.5 bg-neutral-800 border border-neutral-700 rounded-lg text-white focus:border-blue-500 focus:outline-none"
               placeholder="••••••" autocomplete="current-password" />
      </div>
      <button type="submit" id="loginBtn"
              class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition">
        Giriş Yap
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-neutral-400">
      Hesabınız yok mu?
      <a href="/register" class="text-blue-400 hover:text-blue-300">Kayıt Ol</a>
    </p>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Giriş yapılıyor…';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value,
      }),
    });
    const data = await res.json();
    if (res.ok && (data.ok || data.user_id)) {
      window.location.href = '/trade';
    } else {
      errEl.textContent = data.error || 'Giriş başarısız';
      errEl.classList.remove('hidden');
    }
  } catch (err) {
    errEl.textContent = 'Bağlantı hatası';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Giriş Yap';
  }
});
</script>
{% endblock %}
