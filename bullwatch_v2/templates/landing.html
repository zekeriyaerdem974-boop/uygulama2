<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZKR — Piyasa İstihbarası Terminali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, 25px); }
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, -20px) scale(1.1); }
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }
        
        .loading-spinner::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            top: 50%;
            left: 50%;
            margin: -7px 0 0 -7px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Tailwind arbitrary values */
        .bg-slate-900\/50 {
            background-color: rgb(15 23 42 / 0.5);
        }

        .border-slate-700 {
            border-color: rgb(51 65 85);
        }

        .text-slate-200 {
            color: rgb(226 232 240);
        }

        .text-slate-400 {
            color: rgb(148 163 184);
        }

        .focus\:border-cyan-500:focus {
            border-color: rgb(6 182 212);
        }

        .focus\:ring-cyan-500:focus {
            --tw-ring-color: rgb(6 182 212);
        }

        .bg-\[\#0f172a\]\/60 {
            background-color: rgb(15 23 42 / 0.6);
        }

        .border-slate-700\/50 {
            border-color: rgb(51 65 85 / 0.5);
        }

        .bg-cyan-600 {
            background-color: rgb(8 145 178);
        }

        .hover\:bg-cyan-500:hover {
            background-color: rgb(6 182 212);
        }

        .text-slate-400 {
            color: rgb(148 163 184);
        }
    </style>
</head>
<body class="w-full h-full bg-[#030712] text-white font-sans overflow-hidden">
    <!-- Animated Background Layer (z-0) -->
    <div class="fixed inset-0 w-full h-full z-0 pointer-events-none" style="background: linear-gradient(135deg, rgba(3, 55, 148, 0.25) 0%, transparent 50%, rgba(59, 130, 246, 0.15) 100%); animation: drift 20s ease-in-out infinite;"></div>
    
    <!-- Animated Gradient Accent (z-0) -->
    <div class="fixed inset-0 w-full h-full z-0 pointer-events-none" style="background: radial-gradient(ellipse at 40% 30%, rgba(59, 130, 246, 0.2) 0%, transparent 40%); animation: float 15s ease-in-out infinite;"></div>

    <!-- Gradient Overlay - Dark Mask (z-10) -->
    <div class="fixed inset-0 w-full h-full z-10 pointer-events-none" 
         style="background: radial-gradient(ellipse at center, transparent 10%, rgba(3, 7, 18, 0.5) 70%, rgba(3, 7, 18, 0.8) 100%);">
    </div>

    <!-- Auth Card Container (z-20) -->
    <div class="fixed inset-0 flex items-center justify-center p-4" style="z-index: 20;">
        <div class="w-full max-w-sm animate-fade-in-up">
            <!-- Glassmorphic Card -->
            <div class="bg-[#0f172a]/60 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-8 shadow-2xl">
                
                <!-- Header -->
                <div class="mb-8 text-center">
                    <!-- Logo with Cyan-Blue Gradient -->
                    <div class="text-4xl font-black tracking-tighter bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent mb-2">
                        ZKR
                    </div>
                    <!-- Tagline -->
                    <div class="text-[10px] tracking-[0.2em] text-slate-400 uppercase font-semibold letter-spacing">
                        Proprietary Intelligence
                    </div>
                </div>

                <!-- Tab Buttons -->
                <div class="grid grid-cols-2 gap-3 mb-8">
                    <button class="tab-btn active py-2 px-4 rounded-lg text-xs font-semibold uppercase tracking-wider transition-all"
                            onclick="switchTab('login')" 
                            style="background: linear-gradient(135deg, #3b82f6, #06b6d4); color: white;">
                        Giriş
                    </button>
                    <button class="tab-btn inactive py-2 px-4 rounded-lg text-xs font-semibold uppercase tracking-wider text-slate-400 transition-all hover:text-slate-200"
                            onclick="switchTab('register')"
                            style="background: transparent;">
                        Kayıt
                    </button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="form active">
                    <div class="error-msg mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm hidden" id="loginError"></div>
                    
                    <!-- Email Input -->
                    <div class="mb-4">
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2">E-Posta</label>
                        <input type="email" id="loginEmail" placeholder="name@example.com" required
                               class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 rounded-lg px-4 py-3 text-sm focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition-all"
                               onfocus="clearError('login')">
                    </div>
                    
                    <!-- Password Input -->
                    <div class="mb-6">
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Şifre</label>
                        <input type="password" id="loginPassword" placeholder="••••••" required
                               class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 rounded-lg px-4 py-3 text-sm focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition-all"
                               onfocus="clearError('login')">
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg transition-all mt-4 relative" 
                            id="loginBtn"
                            style="box-shadow: 0 0 15px rgba(8, 145, 178, 0.4);">
                        Giriş Yap
                    </button>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="form hidden">
                    <div class="error-msg mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm hidden" id="registerError"></div>
                    
                    <!-- Username Input -->
                    <div class="mb-4">
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Kullanıcı Adı</label>
                        <input type="text" id="registerUsername" placeholder="kullaniciadi" required
                               class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 rounded-lg px-4 py-3 text-sm focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition-all"
                               onfocus="clearError('register')">
                    </div>
                    
                    <!-- Email Input -->
                    <div class="mb-4">
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2">E-Posta</label>
                        <input type="email" id="registerEmail" placeholder="name@example.com" required
                               class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 rounded-lg px-4 py-3 text-sm focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition-all"
                               onfocus="clearError('register')">
                    </div>
                    
                    <!-- Password Input -->
                    <div class="mb-6">
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Şifre</label>
                        <input type="password" id="registerPassword" placeholder="••••••" required
                               class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 rounded-lg px-4 py-3 text-sm focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition-all"
                               onfocus="clearError('register')">
                    </div>
                    
                    <!-- Üçlü Hukuki Kilit - Checkbox 1: Kullanıcı Sözleşmesi -->
                    <div class="mb-3">
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" id="agreement-check" required
                                   class="mt-1 w-4 h-4 bg-slate-900/50 border border-slate-700 rounded focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 cursor-pointer accent-cyan-600">
                            <span class="text-xs text-slate-300">
                                Kullanıcı Sözleşmesini okudum, anladım ve kabul ediyorum. (Hizmet kapsamının sınırlı olduğu beyanı)
                            </span>
                        </label>
                    </div>
                    
                    <!-- Üçlü Hukuki Kilit - Checkbox 2: Sorumluluk Beyanı -->
                    <div class="mb-3">
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" id="liability-check" required
                                   class="mt-1 w-4 h-4 bg-slate-900/50 border border-slate-700 rounded focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 cursor-pointer accent-cyan-600">
                            <span class="text-xs text-slate-300">
                                Sorumluluk Beyanı ve Risk Bildirimini okudum; sunulan bilgilerin tavsiye değil 'görüş' niteliğinde olduğunu anladım ve kabul ediyorum.
                            </span>
                        </label>
                    </div>
                    
                    <!-- Üçlü Hukuki Kilit - Checkbox 3: KVKK Açık Rızası -->
                    <div class="mb-6">
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" id="kvkk-check" required
                                   class="mt-1 w-4 h-4 bg-slate-900/50 border border-slate-700 rounded focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 cursor-pointer accent-cyan-600">
                            <span class="text-xs text-slate-300">
                                KVKK Aydınlatma Metni kapsamında kişisel verilerimin toplanmasını, muhafazasını ve kanuni saklama süreleri boyunca işlenmesini onaylıyorum.
                            </span>
                        </label>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg transition-all mt-4 relative" 
                            id="registerBtn"
                            style="box-shadow: 0 0 15px rgba(8, 145, 178, 0.4);">
                        Kayıt Ol
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.add('inactive');
            });
            document.querySelectorAll('.form').forEach(form => form.classList.add('hidden'));
            
            event.target.classList.add('active');
            event.target.classList.remove('inactive');
            document.getElementById(tab + 'Form').classList.remove('hidden');
            document.getElementById(tab + 'Error').classList.add('hidden');
        }

        function showError(formId, message) {
            const errorEl = document.getElementById(formId + 'Error');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        function clearError(formId) {
            document.getElementById(formId + 'Error').classList.add('hidden');
        }

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError('login');
            
            const btn = document.getElementById('loginBtn');
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            btn.disabled = true;
            btn.classList.add('loading-spinner');
            btn.style.color = 'transparent';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password }),
                });
                
                const data = await res.json();
                
                if (res.ok && data.ok) {
                    window.location.href = '/tv';
                } else {
                    showError('login', data.error || 'Giriş başarısız');
                }
            } catch (err) {
                showError('login', 'Bağlantı hatası');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading-spinner');
                btn.style.color = 'white';
            }
        });

        // Register Handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError('register');
            
            // Üçlü Hukuki Kilit Validasyonu (The Triple Checkbox Matrix)
            const agrOk = document.getElementById('agreement-check').checked;
            const liaOk = document.getElementById('liability-check').checked;
            const kvkkOk = document.getElementById('kvkk-check').checked;
            
            if (!agrOk || !liaOk || !kvkkOk) {
                showError('register', 'Lütfen platforma kayıt olabilmek için her üç yasal güvence ve rıza beyanını da bizzat onaylayın.');
                return;
            }
            
            const btn = document.getElementById('registerBtn');
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            
            btn.disabled = true;
            btn.classList.add('loading-spinner');
            btn.style.color = 'transparent';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, email, password, accept_terms: true }),
                });
                
                const data = await res.json();
                
                if (res.ok && data.ok) {
                    window.location.href = '/tv';
                } else {
                    showError('register', data.error || 'Kayıt başarısız');
                }
            } catch (err) {
                showError('register', 'Bağlantı hatası');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading-spinner');
                btn.style.color = 'white';
            }
        });
    </script>
</body>
</html>
